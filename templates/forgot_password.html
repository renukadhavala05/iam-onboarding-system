<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identity Recovery</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">

<div class="card auth-card">
    <div class="header">
        <h1>Identity Recovery</h1>
        <p>Verify your identity attributes to reset credentials.</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" class="form-input" required autofocus>
        </div>

        <div class="form-group">
            <label for="employee_id">Employee ID</label>
            <input type="text" id="employee_id" name="employee_id" class="form-input" required>
        </div>

        <button type="submit" class="btn btn-primary btn-full">Verify Identity</button>

        <div style="margin-top: 24px; text-align: center; color: var(--text-muted); font-size: 0.875rem;">
            <a href="/login" style="color: var(--primary); font-weight: 500;">← Back to login</a>
        </div>
    </form>
</div>

</body>
</html>
