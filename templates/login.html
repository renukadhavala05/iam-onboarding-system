<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero Trust Access</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">

<div class="card auth-card">
    <div class="header">
        <h1>System Access</h1>
        <p>Enter your credentials to verify your identity.</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" class="form-input" placeholder="e.g. jdoe.it" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary btn-full">Initiate Unlock</button>

        <div style="margin-top: 16px; text-align: center; font-size: 0.875rem;">
            <a href="{{ url_for('auth.forgot_password') }}" style="color: var(--text-muted); text-decoration: none;">Forgot Password?</a>
        </div>

        <div style="margin-top: 24px; text-align: center; color: var(--text-muted); font-size: 0.875rem;">
            New here? <a href="/register" style="color: var(--primary); font-weight: 500;">Onboard Account →</a>
        </div>
    </form>
</div>

</body>
</html>
